name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:                    # reusable by release.yml as a gate

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Cyrius toolchain
        run: |
          set -e
          # The cyrius.cyml `[package].cyrius` pin is the single source of truth
          # for the toolchain version — no version hardcoded here. Use the upstream
          # installer (NOT a hand-rolled curl+cp): it lays out
          # $HOME/.cyrius/versions/<v>/ which `cyrius deps` pin-checks. The old
          # curl+cp into a flat ~/.cyrius/lib failed that check with
          # "pins version X but it is not installed at .../versions/X/lib", and its
          # `|| true` masked a 404'd release asset as a silent no-op.
          CYRIUS_VERSION="$(grep '^cyrius = ' cyrius.cyml | head -1 | sed 's/cyrius = "\(.*\)"/\1/')"
          echo "Installing Cyrius $CYRIUS_VERSION"
          curl -sSf https://raw.githubusercontent.com/MacCracken/cyrius/main/scripts/install.sh | \
            CYRIUS_VERSION="$CYRIUS_VERSION" sh
          echo "$HOME/.cyrius/bin" >> "$GITHUB_PATH"

      - name: Resolve dependencies
        run: cyrius deps

      - name: Build
        run: |
          mkdir -p build
          cyrius build src/main.cyr build/${{ github.event.repository.name }}

      - name: Build (agnos target)
        # THE GATE THAT WAS MISSING. This bundle is prepended verbatim into
        # consumers that build for agnos (cyim does), so an agnos-invalid call
        # in `[lib].modules` breaks THEIR build, not ours — and nothing here
        # ever compiled the agnos arm, so it shipped.
        #
        # That is exactly how the 1.5.2 defects reached a consumer: a Linux-
        # shaped 3-arg `sys_waitpid` (agnos takes 1) sat here warning-only
        # until cyrius 6.5.1 escalated arity to a hard error, at which point
        # cyim's `--agnos` build failed on OUR file. Host tests cannot catch
        # this class — the `#ifdef CYRIUS_TARGET_AGNOS` arms are never
        # compiled on the host, so a green suite says nothing about them.
        #
        # Undefined functions are downgraded to warnings by default when a
        # call site is unreachable, so a clean OK here is the real assertion:
        # it means every agnos arm resolves against the agnos syscall surface.
        run: cyrius build --agnos src/main.cyr build/cyim-lsp-agnos

      - name: Test
        # Explicit per-file loop rather than bare `cyrius test`.
        # Bare `cyrius test` auto-discovery proved CI-flaky at
        # cyim-lsp v0.2.0 ("No .tcyr files found in tests/tcyr/
        # or tests/" despite tests/ having .tcyr files; not
        # reproducible locally). The explicit loop is robust
        # against discovery edge cases and surfaces per-file
        # failures clearly. Add new .tcyr files to tests/ and
        # they're picked up automatically.
        run: |
          set -e
          fail=0
          for f in tests/*.tcyr; do
            [ -f "$f" ] || continue
            echo "::group::$f"
            cyrius test "$f" || fail=1
            echo "::endgroup::"
          done
          if [ -f src/test.cyr ]; then
            echo "::group::src/test.cyr ([build].test)"
            cyrius test src/test.cyr || fail=1
            echo "::endgroup::"
          fi
          [ $fail -eq 0 ] || { echo "test: one or more suites failed"; exit 1; }
