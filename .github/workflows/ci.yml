name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:                    # reusable by release.yml as a gate

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Cyrius toolchain
        run: |
          CYRIUS_VERSION="${CYRIUS_VERSION:-$(grep 'cyrius *= *"' cyrius.cyml 2>/dev/null | head -1 | sed 's/.*"\(.*\)"/\1/')}"
          echo "Installing Cyrius $CYRIUS_VERSION"
          curl -sLO "https://github.com/MacCracken/cyrius/releases/download/$CYRIUS_VERSION/cyrius-$CYRIUS_VERSION-x86_64-linux.tar.gz"
          tar xzf "cyrius-$CYRIUS_VERSION-x86_64-linux.tar.gz"
          CYRIUS_DIR="cyrius-$CYRIUS_VERSION-x86_64-linux"
          mkdir -p "$HOME/.cyrius/bin" "$HOME/.cyrius/lib"
          cp "$CYRIUS_DIR/bin/"* "$HOME/.cyrius/bin/" 2>/dev/null || true
          cp -r "$CYRIUS_DIR/lib/"* "$HOME/.cyrius/lib/" 2>/dev/null || true
          chmod +x "$HOME/.cyrius/bin/"* 2>/dev/null || true
          echo "$HOME/.cyrius/bin" >> $GITHUB_PATH
          echo "CYRIUS_HOME=$HOME/.cyrius" >> $GITHUB_ENV

      - name: Resolve dependencies
        run: cyrius deps

      - name: Build
        run: |
          mkdir -p build
          cyrius build src/main.cyr build/${{ github.event.repository.name }}

      - name: Test
        # Explicit per-file loop rather than bare `cyrius test`.
        # Bare `cyrius test` auto-discovery proved CI-flaky at
        # cyim-lsp v0.2.0 ("No .tcyr files found in tests/tcyr/
        # or tests/" despite tests/ having .tcyr files; not
        # reproducible locally). The explicit loop is robust
        # against discovery edge cases and surfaces per-file
        # failures clearly. Add new .tcyr files to tests/ and
        # they're picked up automatically.
        run: |
          set -e
          fail=0
          for f in tests/*.tcyr; do
            [ -f "$f" ] || continue
            echo "::group::$f"
            cyrius test "$f" || fail=1
            echo "::endgroup::"
          done
          if [ -f src/test.cyr ]; then
            echo "::group::src/test.cyr ([build].test)"
            cyrius test src/test.cyr || fail=1
            echo "::endgroup::"
          fi
          [ $fail -eq 0 ] || { echo "test: one or more suites failed"; exit 1; }
